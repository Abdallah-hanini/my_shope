# Local development infrastructure only (docs/ARCHITECTURE.md). Not a production topology.
name: automotive-erp
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  # Evictable cache. Never authoritative (CLAUDE.md).
  redis-cache:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru', '--save', '']
    ports: ['127.0.0.1:${REDIS_CACHE_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # BullMQ queue store: separate from the cache, never evicts, AOF persistence.
  redis-queue:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports: ['127.0.0.1:${REDIS_QUEUE_PORT:-6380}:6379']
    volumes: [redisqueue:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Local sign-in server for development, same realm definition as production
  # (deploy/keycloak/realm-erp.json). Dev-only credentials; start with `pnpm auth:up`.
  keycloak:
    image: keycloak/keycloak:26.4.7
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_DEV_ADMIN_PASSWORD:-admin_local_dev_only}
      KC_ADMIN_SERVER_URL: http://localhost:8080
      KC_HEALTH_ENABLED: 'true'
      ERP_PUBLIC_URL: http://localhost:3000
      ERP_WEB_CLIENT_SECRET: ${ERP_WEB_CLIENT_SECRET:-erp_web_local_dev_only}
    ports: ['127.0.0.1:${KEYCLOAK_PORT:-8080}:8080']
    volumes:
      - ./deploy/keycloak/realm-erp.json:/opt/keycloak/data/import/realm-erp.json:ro
      - ./deploy/scripts:/erp-scripts:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
  redisqueue:
